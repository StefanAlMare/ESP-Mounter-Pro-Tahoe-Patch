name: Publish Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create v2.0 release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="downloads/ESP-Mounter-Pro-Tahoe-Patcher-2.0-PUBLIC.zip"
          if gh release view v2.0 >/dev/null 2>&1; then
            gh release upload v2.0 "$ASSET" --clobber
          else
            gh release create v2.0 "$ASSET" \
              --title "ESP Mounter Pro Tahoe Patcher 2.0" \
              --notes-file RELEASE_NOTES_v2.0.md
          fi
